<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">A gray-looking surface can have different causes.</title><desc id="desc">Inspect dry in consistent light before treating the whole garment.</desc><rect width="900" height="390" fill="#eae8df"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20231f}.heading{font-size:23px;font-weight:bold}.label{font-size:19px}.small{font-size:17px}.accent{fill:#a83e28}.line{stroke:#20231f;stroke-width:2;fill:none}.box{fill:#f4f2eb;stroke:#b2b3a7;stroke-width:1.5}</style><text x="35" y="48" class="heading">A gray-looking surface can have different causes.</text><rect x="30" y="100" width="240" height="155" class="box"/><text x="150" y="142" text-anchor="middle" class="heading">COLOR</text><text x="150" y="188" text-anchor="middle" class="small">Uniform lighter tone</text><text x="150" y="218" text-anchor="middle" class="small">No restoration promise</text><path d="M275 175 h45 l-12 -10 m12 10 l-12 10" class="line"/><rect x="330" y="100" width="240" height="155" class="box"/><text x="450" y="142" text-anchor="middle" class="heading">RESIDUE</text><text x="450" y="188" text-anchor="middle" class="small">Pale surface deposits</text><text x="450" y="218" text-anchor="middle" class="small">Review dose / rinse</text><path d="M575 175 h45 l-12 -10 m12 10 l-12 10" class="line"/><rect x="630" y="100" width="240" height="155" class="box"/><text x="750" y="142" text-anchor="middle" class="heading">FIBERS</text><text x="750" y="188" text-anchor="middle" class="small">Loose lint or pills</text><text x="750" y="218" text-anchor="middle" class="small">Choose matching care</text><text x="450" y="320" text-anchor="middle" class="small">Inspect dry in consistent light before treating the whole garment.</text></svg>