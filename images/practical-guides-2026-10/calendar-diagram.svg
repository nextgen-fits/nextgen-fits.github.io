<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Three crown positions</title><desc id="desc">Conceptual diagram: normal operating position winds; first click quick-sets day and date; second click sets time and stops seconds. Unlock a screw-down crown first.</desc><rect width="900" height="390" fill="#eae8df"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20231f}.heading{font-size:23px;font-weight:bold}.label{font-size:19px}.small{font-size:17px}.accent{fill:#a83e28}.line{stroke:#20231f;stroke-width:2;fill:none}.box{fill:#f4f2eb;stroke:#b2b3a7;stroke-width:1.5}</style><text x="35" y="43" class="heading">Operating positions · 4R36 / NH36</text><rect x="60" y="100" width="100" height="120" class="box"/><path d="M160 160 h30" class="line"/><rect x="182" y="140" width="30" height="40" fill="#20231f"/><text x="60" y="260" class="heading">Normal</text><text x="60" y="294" class="label">Manual winding</text><rect x="345" y="100" width="100" height="120" class="box"/><path d="M445 160 h50" class="line"/><rect x="487" y="140" width="30" height="40" fill="#20231f"/><text x="345" y="260" class="heading">First click</text><text x="345" y="294" class="label">Day / date quickset</text><rect x="630" y="100" width="100" height="120" class="box"/><path d="M730 160 h70" class="line"/><rect x="792" y="140" width="30" height="40" fill="#20231f"/><text x="630" y="260" class="heading">Second click</text><text x="630" y="294" class="label">Time + stop-seconds</text><text x="35" y="350" class="small">Unlock a screw-down crown first. This is a schematic, not a scale drawing.</text></svg>