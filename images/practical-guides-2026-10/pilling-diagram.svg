<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Identify first. Stop at the first sign of damage.</title><desc id="desc">A snag is not a pill. Removing fibers does not rebuild worn fabric.</desc><rect width="900" height="390" fill="#eae8df"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20231f}.heading{font-size:23px;font-weight:bold}.label{font-size:19px}.small{font-size:17px}.accent{fill:#a83e28}.line{stroke:#20231f;stroke-width:2;fill:none}.box{fill:#f4f2eb;stroke:#b2b3a7;stroke-width:1.5}</style><text x="35" y="48" class="heading">Identify first. Stop at the first sign of damage.</text><rect x="30" y="100" width="240" height="155" class="box"/><text x="150" y="142" text-anchor="middle" class="heading">INSPECT</text><text x="150" y="188" text-anchor="middle" class="small">Pills, lint or a snag?</text><text x="150" y="218" text-anchor="middle" class="small">Check fabric condition</text><path d="M275 175 h45 l-12 -10 m12 10 l-12 10" class="line"/><rect x="330" y="100" width="240" height="155" class="box"/><text x="450" y="142" text-anchor="middle" class="heading">LOCAL TRIAL</text><text x="450" y="188" text-anchor="middle" class="small">Suitable tool / manual</text><text x="450" y="218" text-anchor="middle" class="small">Flat and unstretched</text><path d="M575 175 h45 l-12 -10 m12 10 l-12 10" class="line"/><rect x="630" y="100" width="240" height="155" class="box"/><text x="750" y="142" text-anchor="middle" class="heading">REASSESS</text><text x="750" y="188" text-anchor="middle" class="small">Look and feel</text><text x="750" y="218" text-anchor="middle" class="small">Stop if it catches</text><text x="450" y="320" text-anchor="middle" class="small">A snag is not a pill. Removing fibers does not rebuild worn fabric.</text></svg>