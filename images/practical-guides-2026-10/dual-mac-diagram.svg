<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Mirroring through MST versus independent supported outputs</title><desc id="desc">Top row shows one native signal split by an MST hub into mirrored screens on the documented Mac hub arrangement. Bottom shows two supported independent native paths. Exact Mac limits still apply.</desc><rect width="900" height="390" fill="#eae8df"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20231f}.heading{font-size:23px;font-weight:bold}.label{font-size:19px}.small{font-size:17px}.accent{fill:#a83e28}.line{stroke:#20231f;stroke-width:2;fill:none}.box{fill:#f4f2eb;stroke:#b2b3a7;stroke-width:1.5}</style><text x="30" y="42" class="heading">Ask how the dock creates separate displays.</text><rect x="30" y="83" width="150" height="90" class="box"/><text x="105" y="136" text-anchor="middle" class="label">Mac</text><rect x="315" y="83" width="210" height="90" class="box"/><text x="420" y="136" text-anchor="middle" class="label">MST hub</text><path d="M180 127 H315 M525 127 H590 V93 H655 M590 127 V164 H655" class="line"/><rect x="655" y="66" width="210" height="54" class="box"/><rect x="655" y="137" width="210" height="54" class="box"/><text x="760" y="100" text-anchor="middle" class="small">Screen A · same image</text><text x="760" y="171" text-anchor="middle" class="small">Screen B · same image</text><text x="32" y="211" class="small">A documented MST mirror arrangement is not two extended desktops.</text><rect x="30" y="260" width="150" height="82" class="box"/><text x="105" y="309" text-anchor="middle" class="label">Mac</text><path d="M180 284 H655 M180 321 H655" class="line"/><text x="407" y="275" text-anchor="middle" class="small">Supported independent native paths</text><rect x="655" y="252" width="210" height="47" class="box"/><rect x="655" y="314" width="210" height="47" class="box"/><text x="760" y="282" text-anchor="middle" class="small">Screen A</text><text x="760" y="344" text-anchor="middle" class="small">Screen B</text><text x="30" y="377" class="small">Exact Mac model, display modes and lid requirements still apply.</text></svg>