<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Movement height and beat frequency</title><desc id="desc">NH35 movement height is 5.32 millimeters versus Miyota 9015 at 3.90 millimeters. Beat-frequency examples show six versus eight beats in one second; not a finished-watch thickness drawing.</desc><rect width="900" height="390" fill="#eae8df"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20231f}.heading{font-size:23px;font-weight:bold}.label{font-size:19px}.small{font-size:17px}.accent{fill:#a83e28}.line{stroke:#20231f;stroke-width:2;fill:none}.box{fill:#f4f2eb;stroke:#b2b3a7;stroke-width:1.5}</style><text x="35" y="44" class="heading">Movement dimensions are not finished-watch dimensions.</text><text x="45" y="95" class="heading">NH35A</text><rect x="45" y="140" width="300" height="53.2" fill="#20231f"/><text x="45" y="229" class="label">5.32 mm movement height</text><text x="470" y="95" class="heading">Miyota 9015</text><rect x="470" y="154.2" width="300" height="39" fill="#a83e28"/><text x="470" y="229" class="label">3.90 mm movement height</text><text x="45" y="274" class="small">6 beats per second</text><text x="470" y="274" class="small">8 beats per second</text><circle cx="57" cy="305" r="6" fill="#20231f"/><circle cx="93" cy="305" r="6" fill="#20231f"/><circle cx="129" cy="305" r="6" fill="#20231f"/><circle cx="165" cy="305" r="6" fill="#20231f"/><circle cx="201" cy="305" r="6" fill="#20231f"/><circle cx="237" cy="305" r="6" fill="#20231f"/><circle cx="482" cy="305" r="6" fill="#a83e28"/><circle cx="518" cy="305" r="6" fill="#a83e28"/><circle cx="554" cy="305" r="6" fill="#a83e28"/><circle cx="590" cy="305" r="6" fill="#a83e28"/><circle cx="626" cy="305" r="6" fill="#a83e28"/><circle cx="662" cy="305" r="6" fill="#a83e28"/><circle cx="698" cy="305" r="6" fill="#a83e28"/><circle cx="734" cy="305" r="6" fill="#a83e28"/><text x="35" y="361" class="small">Conceptual comparison from supplier specifications; not a measured watch test.</text></svg>