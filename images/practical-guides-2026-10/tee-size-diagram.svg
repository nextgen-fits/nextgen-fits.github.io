<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">T-shirt measurement endpoints</title><desc id="desc">Conceptual set-in-sleeve T-shirt. Match the seller chest line, high shoulder point to hem for this length method, and shoulder seam endpoints. This is not a universal size chart.</desc><rect width="900" height="390" fill="#eae8df"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20231f}.heading{font-size:23px;font-weight:bold}.label{font-size:19px}.small{font-size:17px}.accent{fill:#a83e28}.line{stroke:#20231f;stroke-width:2;fill:none}.box{fill:#f4f2eb;stroke:#b2b3a7;stroke-width:1.5}</style><text x="35" y="42" class="heading">Match the seller's endpoints, not just the dimension name.</text><path d="M230 95 L165 105 L85 155 L120 218 L178 183 L178 307 L422 307 L422 183 L480 218 L515 155 L435 105 L370 95 Q352 130 300 130 Q248 130 230 95Z" class="box"/><path d="M165 105 L178 183 M435 105 L422 183" class="line"/><path d="M188 200 H412 M198 192 L188 200 L198 208 M402 192 L412 200 L402 208 M170 76 H430 M180 68 L170 76 L180 84 M420 68 L430 76 L420 84" class="line"/><path d="M230 95 V307 M222 105 L230 95 L238 105 M222 297 L230 307 L238 297" stroke="#a83e28" stroke-width="3" fill="none"/><text x="300" y="65" text-anchor="middle" class="small">Shoulder seam to seam</text><text x="312" y="234" text-anchor="middle" class="small">Chest width</text><text x="565" y="123" class="label">Length shown here:</text><text x="565" y="158" class="small">High shoulder → hem</text><text x="565" y="221" class="label">Chest line:</text><text x="565" y="256" class="small">Use the seller's method</text><text x="450" y="355" text-anchor="middle" class="small">Conceptual set-in-sleeve tee. Flat width is not body circumference.</text></svg>