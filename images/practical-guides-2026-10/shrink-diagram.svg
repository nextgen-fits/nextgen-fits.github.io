<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Compare the same dry garment dimensions</title><desc id="desc">Measure the same length and width endpoints, dry and relaxed. Length and width changes are separate; an example of seventy to sixty-eight centimeters is a 2.9 percent reduction.</desc><rect width="900" height="390" fill="#eae8df"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20231f}.heading{font-size:23px;font-weight:bold}.label{font-size:19px}.small{font-size:17px}.accent{fill:#a83e28}.line{stroke:#20231f;stroke-width:2;fill:none}.box{fill:#f4f2eb;stroke:#b2b3a7;stroke-width:1.5}</style><text x="35" y="45" class="heading">Same garment · same points · dry and relaxed</text><path d="M195 80 L140 100 L80 175 L130 210 L165 165 L165 300 L385 300 L385 165 L420 210 L470 175 L410 100 L355 80 Q325 45 305 45 H245 Q215 45 195 80Z" class="box"/><path d="M195 80 Q275 145 355 80" class="line"/><path d="M180 185 H370 M190 177 L180 185 L190 193 M360 177 L370 185 L360 193" class="line"/><text x="275" y="170" text-anchor="middle" class="small">Width · fixed line</text><path d="M490 100 V300 M482 110 L490 100 L498 110 M482 290 L490 300 L498 290" class="line"/><text x="510" y="200" class="small">Length</text><text x="600" y="119" class="heading">Example only</text><text x="600" y="163" class="label">70 cm → 68 cm</text><text x="600" y="210" class="heading">2.9% reduction</text><text x="450" y="352" text-anchor="middle" class="small">(before − after) ÷ before × 100 · Do not stretch while measuring.</text></svg>