<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">USB-C video needs a supported complete path</title><desc id="desc">A computer video output connects through a compatible video cable to the designated monitor video input. Check all three, then insert a dock only after a working direct test.</desc><rect width="900" height="390" fill="#eae8df"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20231f}.heading{font-size:23px;font-weight:bold}.label{font-size:19px}.small{font-size:17px}.accent{fill:#a83e28}.line{stroke:#20231f;stroke-width:2;fill:none}.box{fill:#f4f2eb;stroke:#b2b3a7;stroke-width:1.5}</style><text x="35" y="46" class="heading">The plug shape is only the starting point.</text><rect x="30" y="115" width="240" height="130" class="box"/><text x="150" y="158" text-anchor="middle" class="heading">COMPUTER</text><text x="150" y="207" text-anchor="middle" class="small">Supported video output</text><rect x="330" y="115" width="240" height="130" class="box"/><text x="450" y="158" text-anchor="middle" class="heading">CABLE</text><text x="450" y="207" text-anchor="middle" class="small">Required video mode</text><rect x="630" y="115" width="240" height="130" class="box"/><text x="750" y="158" text-anchor="middle" class="heading">MONITOR</text><text x="750" y="207" text-anchor="middle" class="small">Designated video input</text><path d="M275 180 h45 l-12 -10 m12 10 l-12 10 M575 180 h45 l-12 -10 m12 10 l-12 10" class="line"/><text x="450" y="297" text-anchor="middle" class="label">Test one direct connection first.</text><text x="450" y="335" text-anchor="middle" class="small">Charging or USB data working does not establish video support.</text></svg>