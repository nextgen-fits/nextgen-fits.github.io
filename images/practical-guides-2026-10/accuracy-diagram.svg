<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Offset versus daily gain</title><desc id="desc">Teaching example: plus twelve seconds at day zero and plus twenty-five seconds after twenty-four hours gives plus thirteen seconds per day.</desc><rect width="900" height="390" fill="#eae8df"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20231f}.heading{font-size:23px;font-weight:bold}.label{font-size:19px}.small{font-size:17px}.accent{fill:#a83e28}.line{stroke:#20231f;stroke-width:2;fill:none}.box{fill:#f4f2eb;stroke:#b2b3a7;stroke-width:1.5}</style><text x="40" y="48" class="heading">An offset is a reading. A rate is a change.</text><line x1="115" y1="195" x2="780" y2="195" class="line"/><circle cx="180" cy="195" r="10" fill="#a83e28"/><circle cx="715" cy="195" r="10" fill="#a83e28"/><text x="180" y="115" text-anchor="middle" class="heading">+12 seconds</text><text x="715" y="115" text-anchor="middle" class="heading">+25 seconds</text><text x="180" y="247" text-anchor="middle" class="label">Day 0 · baseline</text><text x="715" y="247" text-anchor="middle" class="label">24 hours later</text><text x="450" y="174" text-anchor="middle" class="small">24 hours between readings</text><rect x="90" y="291" width="720" height="62" rx="0" class="box"/><text x="450" y="331" text-anchor="middle" class="heading">(+25 − +12) ÷ 1 day = +13 seconds/day</text></svg>