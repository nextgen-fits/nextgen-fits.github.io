<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Keep measurement conditions with an accuracy specification</title><desc id="d">NH36 static range minus twenty to plus forty seconds per day and 4R36 on-wrist range minus thirty-five to plus forty-five are not a controlled comparison.</desc><rect width="900" height="360" fill="#eae8df"/><g fill="#20231f" font-family="Arial, sans-serif"><text x="35" y="48" font-size="25" font-weight="bold">Two documents. Different measurement contexts.</text><rect x="35" y="85" width="390" height="180" fill="#fffef9"/><rect x="475" y="85" width="390" height="180" fill="#fffef9"/><text x="65" y="130" font-size="22">TMI NH36</text><text x="65" y="180" font-size="29">−20 to +40 s/day</text><text x="65" y="225" font-size="18">Static procedure in technical guide</text><text x="505" y="130" font-size="22">Seiko 4R36</text><text x="505" y="180" font-size="29">−35 to +45 s/day</text><text x="505" y="225" font-size="18">Stated on-wrist consumer conditions</text><text x="35" y="314" font-size="21">Neither range proves every example beats the other.</text></g></svg>